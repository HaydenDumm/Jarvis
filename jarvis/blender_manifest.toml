schema_version = "1.0.0"

id = "jarvis"
version = "0.1.0"
name = "Jarvis"
tagline = "Model by text or voice with Claude, live in the viewport"
maintainer = "HaydenDumm"
type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Sends requests and a scene summary to the Claude API"
files = "Reads and saves asset libraries, installs its packages"
microphone = "Records voice commands, transcribed on this PC"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "*.zip"]
